worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 500M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        image/svg+xml;

    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    upstream server_upstream {
        server server:8008;
        keepalive 32;
    }

    upstream minio_upstream {
        server minio:9000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Next.js Web Frontend & Dynamic Routes
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI Backend API Endpoints
        location /api/ {
            proxy_pass http://server_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }

        # FastAPI Health Check
        location /health {
            proxy_pass http://server_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Prometheus Metrics
        location /metrics {
            proxy_pass http://server_upstream/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Real-Time WebSockets
        location /ws/ {
            proxy_pass http://server_upstream/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # S3 / MinIO Immutable Media Asset Storage with Aggressive Caching
        location /storage/ {
            rewrite ^/storage/(.*)$ /$1 break;
            proxy_pass http://minio_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
