[project]
name = "ai-video-studio"
version = "1.0.0"
description = "Enterprise AI Video Production Engine combining AI-Content-Studio and ContentMachine"
readme = "DEVELOPMENT_PLAN.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "redis>=5.0.8",
    "arq>=0.26.0",
    "aioboto3>=13.1.1",
    "httpx[http2]>=0.27.0",
    "filelock>=3.15.4",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "python-jose[cryptography]>=3.3.0",
    "google-genai>=0.1.1",
    "anthropic>=0.34.0",
    "replicate>=0.32.0",
    "fal-client>=0.4.0",
    "elevenlabs>=1.6.0",
    "ffmpeg-python>=0.2.0",
    "pysubs2>=1.7.0",
    "yt-dlp>=2024.8.6",
    "aiosqlite>=0.20.0",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "server/tests"]
pythonpath = [".", "server", "workers"]
